<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор случайных чисел</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.58), rgba(15, 23, 42, 0.58)),
        url("https://40.img.avito.st/image/1/1.DfA-37aAoRkofwMYKIcWxBp_ox2MaKUZjA_AHYzcoLuLfKUDKH8DGIg.NLyDmXAYa8slftj5Bn0c3khp4fM9GANWSU4jpJZpf64");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #f8fafc;
      user-select: none;
    }

    .top-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: rgba(30, 41, 59, 0.88);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      color: #e2e8f0;
    }

    .field input {
      width: 92px;
      padding: 8px 10px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      color: #f8fafc;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
    }

    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      cursor: pointer;
    }

    .number {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      color: #38bdf8;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75);
    }

    .hint {
      margin-top: 20px;
      font-size: 15px;
      color: #e2e8f0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .error {
      margin-top: 14px;
      font-size: 14px;
      color: #fca5a5;
      min-height: 20px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div class="top-menu">
    <label class="field">
      <span>От</span>
      <input id="minInput" type="number" value="1">
    </label>
    <label class="field">
      <span>До</span>
      <input id="maxInput" type="number" value="100">
    </label>
  </div>

  <div id="tapArea" class="tap-area" onclick="generateNumber()" ontouchstart="generateNumber()">
    <div id="result" class="number">—</div>
    <div class="hint">Тапни по центру экрана</div>
    <div id="error" class="error"></div>
  </div>

  <script>
    var lastTapTime = 0;

    function generateNumber() {
      var now = Date.now();
      if (now - lastTapTime < 150) {
        return;
      }
      lastTapTime = now;

      var minInput = document.getElementById('minInput');
      var maxInput = document.getElementById('maxInput');
      var resultEl = document.getElementById('result');
      var errorEl = document.getElementById('error');

      var min = parseInt(minInput.value, 10);
      var max = parseInt(maxInput.value, 10);

      if (isNaN(min) || isNaN(max)) {
        errorEl.textContent = 'Введи оба числа';
        return;
      }

      if (min > max) {
        errorEl.textContent = '«От» должно быть меньше или равно «До»';
        return;
      }

      errorEl.textContent = '';
      var num = Math.floor(Math.random() * (max - min + 1)) + min;
      resultEl.textContent = String(num);
    }
  </script>
</body>
</html>
