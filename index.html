<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор случайных чисел</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      background-color: #121212;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.25s ease;
      z-index: 1;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .app {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 18px 28px;
    }

    .range-panel {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(20, 20, 20, 0.72);
      padding: 10px 16px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }

    .range-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
    }

    .range-field input {
      width: 78px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 16px;
      text-align: center;
    }

    .tap-zone {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .number {
      font-size: clamp(72px, 24vw, 150px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.75);
    }

    .hint {
      margin-top: 16px;
      font-size: 15px;
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .footer-note {
      font-size: 12px;
      opacity: 0.75;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="bgLayer" class="bg-layer"></div>
  <div class="overlay"></div>

  <div class="app">
    <div class="range-panel">
      <label class="range-field">
        От
        <input id="minInput" type="number" value="1">
      </label>
      <label class="range-field">
        До
        <input id="maxInput" type="number" value="100">
      </label>
    </div>

    <div id="tapZone" class="tap-zone">
      <div id="numberDisplay" class="number">—</div>
      <div class="hint">Тапни по центру для нового числа и фона</div>
    </div>

    <div class="footer-note">Случайный фон из 5 фото репозитория</div>
  </div>

  <script>
    const photos = [
      "Screenshot_20261011_194050_com_hihonor_photos_GalleryMain.jpg",
      "IMG_20261022_204145.jpg",
      "IMG_20261017_004006.jpg",
      "IMG_20261015_220528.jpg",
      "IMG_20261009_221903_804.jpg"
    ];

    const bgLayer = document.getElementById("bgLayer");
    const numberDisplay = document.getElementById("numberDisplay");
    const minInput = document.getElementById("minInput");
    const maxInput = document.getElementById("maxInput");
    const tapZone = document.getElementById("tapZone");

    let lastPhotoIndex = -1;

    // Предзагрузка картинок для более быстрой смены
    photos.forEach((src) => {
      const img = new Image();
      img.src = src;
    });

    function getRandomPhoto() {
      if (photos.length === 1) return photos[0];
      let idx = Math.floor(Math.random() * photos.length);
      if (idx === lastPhotoIndex) {
        idx = (idx + 1) % photos.length;
      }
      lastPhotoIndex = idx;
      return photos[idx];
    }

    function generateNumberAndBg() {
      let minVal = parseInt(minInput.value, 10);
      let maxVal = parseInt(maxInput.value, 10);

      if (Number.isNaN(minVal)) minVal = 1;
      if (Number.isNaN(maxVal)) maxVal = 100;

      if (minVal > maxVal) {
        const temp = minVal;
        minVal = maxVal;
        maxVal = temp;
        minInput.value = minVal;
        maxInput.value = maxVal;
      }

      const randomNum = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
      numberDisplay.textContent = randomNum;

      const nextPhoto = getRandomPhoto();
      bgLayer.style.backgroundImage = `url("${nextPhoto}")`;
    }

    tapZone.addEventListener("click", generateNumberAndBg);

    // Первый запуск при открытии страницы
    generateNumberAndBg();
  </script>
</body>
</html>
